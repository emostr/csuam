services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csuam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csuam}
      POSTGRES_DB: ${POSTGRES_DB:-csuam}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csuam} -d ${POSTGRES_DB:-csuam}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-GKcsuamdevaccesskey}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-csuam-dev-secret-change-me}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-csuam}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-csuam}:${POSTGRES_PASSWORD:-csuam}@postgres:5432/${POSTGRES_DB:-csuam}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      S3_ENDPOINT: garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKcsuamdevaccesskey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-csuam-dev-secret-change-me}
      S3_BUCKET: ${S3_BUCKET:-csuam}
      S3_REGION: garage
      S3_USE_SSL: "false"
      SEED_HEAD_TEACHER_PASSWORD: ${SEED_HEAD_TEACHER_PASSWORD:-zavuch123}
      SEED_LIBRARIAN_PASSWORD: ${SEED_LIBRARIAN_PASSWORD:-biblio123}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-teacher123}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8000}:80"

volumes:
  pgdata:
  garagedata:
