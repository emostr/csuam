services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csuam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csuam}
      POSTGRES_DB: ${POSTGRES_DB:-csuam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csuam}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-csuam}:${POSTGRES_PASSWORD:-csuam}@postgres:5432/${POSTGRES_DB:-csuam}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-csuam}
      MINIO_USE_SSL: "false"
      SEED_HEAD_TEACHER_PASSWORD: ${SEED_HEAD_TEACHER_PASSWORD:-zavuch123}
      SEED_LIBRARIAN_PASSWORD: ${SEED_LIBRARIAN_PASSWORD:-biblio123}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-teacher123}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8000}:80"

volumes:
  pgdata:
  miniodata:
