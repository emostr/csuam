services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-csuam-root}
      MARIADB_USER: ${MARIADB_USER:-csuam}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-csuam}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-csuam}
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: "8080"
      DATABASE_URL: ${MARIADB_USER:-csuam}:${MARIADB_PASSWORD:-csuam}@tcp(mariadb:3306)/${MARIADB_DATABASE:-csuam}?parseTime=true&multiStatements=true
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-csuam}
      MINIO_USE_SSL: "false"
      SEED_HEAD_TEACHER_PASSWORD: ${SEED_HEAD_TEACHER_PASSWORD:-zavuch123}
      SEED_LIBRARIAN_PASSWORD: ${SEED_LIBRARIAN_PASSWORD:-biblio123}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-teacher123}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8000}:80"

volumes:
  mariadbdata:
  miniodata:
